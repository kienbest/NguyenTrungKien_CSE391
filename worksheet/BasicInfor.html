<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Form</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#ffffff;
        }

        .container{
            width:700px;
            margin:30px auto;
            background:#f5f5f5;
            border:1px solid #dcdcdc;
            padding:20px;
            box-shadow:0 0 5px rgba(0,0,0,0.1);
        }

        h3{
            margin-top:20px;
            margin-bottom:10px;
            border-bottom:1px solid gray;
            padding-bottom:5px;
        }

        .row{
            display:flex;
            align-items:center;
            margin:8px 0;
        }

        .row label{
            width:150px;
            font-weight:bold;
            font-size:14px;
        }

        .row input[type="text"],
        .row input[type="email"],
        .row input[type="date"],
        .row select,
        .row textarea{
            flex:1;
            padding:5px;
            border:1px solid #999;
        }

        .gender-group,
        .shift-group{
            display:flex;
            flex-direction:column;
            gap:3px;
        }

        textarea{
            height:120px;
            resize:none;
        }

        .captcha{
            font-size:30px;
            font-family:monospace;
            letter-spacing:3px;
            margin-right:20px;
            color:#666;
        }

        .buttons{
            text-align:right;
            margin-top:20px;
            border-top:1px solid gray;
            padding-top:15px;
        }

        button{
            padding:8px 15px;
            background:#333;
            color:white;
            border:none;
            cursor:pointer;
            margin-left:10px;
        }

        button:hover{
            background:#555;
        }

        .required{
            font-size:13px;
            margin-top:10px;
        }
    </style>
</head>
<body>

<form>
    <div class="container">

        <h3>Basic Info</h3>

        <div class="row">
            <label>Employee ID</label>
            <input type="text" value="9">
        </div>

        <div class="row">
            <label>Last Name</label>
            <input type="text" value="Dodsworth">
        </div>

        <div class="row">
            <label>First Name</label>
            <input type="text" value="Anne">
        </div>

        <div class="row">
            <label>Gender</label>
            <div class="gender-group">
                <span><input type="radio" name="gender"> Male</span>
                <span><input type="radio" name="gender"> Female</span>
                <span><input type="radio" name="gender"> XXX</span>
                <span><input type="radio" name="gender" checked> ZZZ</span>
            </div>
        </div>

        <div class="row">
            <label>Title</label>
            <input type="text" value="Sales Representative">
        </div>

        <div class="row">
            <label>Suffix</label>
            <input type="text" value="Ms.">
        </div>

        <div class="row">
            <label>BirthDate</label>
            <input type="date">
        </div>

        <div class="row">
            <label>HireDate</label>
            <input type="date">
        </div>

        <div class="row">
            <label>SSN # (if applicable)</label>
            <input type="text">
        </div>

        <div class="row">
            <label>Reports To</label>
            <select>
                <option>Buchanan</option>
                <option>Davolio</option>
                <option>Fuller</option>
            </select>
        </div>

        <h3>Contact Info</h3>

        <div class="row">
            <label>Email</label>
            <input type="email" placeholder="name@example.com">
        </div>

        <div class="row">
            <label>Address</label>
            <input type="text" value="7 Houndstooth Rd.">
        </div>

        <div class="row">
            <label>City</label>
            <input type="text" value="London">
        </div>

        <div class="row">
            <label>Region</label>
            <input type="text">
        </div>

        <div class="row">
            <label>Postal Code</label>
            <input type="text" value="WG2 7LT">
        </div>

        <div class="row">
            <label>Country</label>
            <select>
                <option>Russian Federation</option>
                <option>USA</option>
                <option>Vietnam</option>
            </select>
        </div>

        <div class="row">
            <label>US Home Phone</label>
            <input type="text" value="(234)234-2342">
        </div>

        <div class="row">
            <label>Photo</label>
            <input type="text" value="EmpID9.bmp">
        </div>

        <h3>Optional Info</h3>

        <div class="row">
            <label>Notes</label>
            <textarea>Xin chao ! Toi la Kien</textarea>
        </div>

        <div class="row">
            <label>Preferred Shift</label>
            <div class="shift-group">
                <span><input type="checkbox"> Regular</span>
                <span><input type="checkbox" checked> Gravy Yard</span>
            </div>
        </div>

        <div class="row">
            <label>Active?</label>
            <input type="checkbox" checked>
        </div>

        <div class="row">
            <label>Are you human?</label>
            <span class="captcha">TIDAWO</span>
            <span>Click to change</span>
        </div>

        <div class="row">
            <label></label>
            <input type="text">
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Cancel</button>
        </div>

        <div class="required">
            * required
        </div>

    </div>
</form>

</body>
</html>
