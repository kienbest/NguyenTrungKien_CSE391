<!DOCTYPE html>
<html Lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Portgolio</title>
    </head>
    <link ref="stylesheet" href="style.css">
    <body>
        <header>
            <div class="container nav-wrapper">
                   <div class ="logo">Trung Kien</div>
            <nav>
                <a href="#about">About</a>
                <a href="#skill">Skill</a>
                <a href="#portfolio">Portfolio</a>
                <a href="#contact">Contact</a>
            </nav>
            </div>
        </header>
        <main>
            <section id="hero">

                <h1>Hi, I'm Kien</h1>
                

                <p>
                    Full-Stack Developer | UI Designer | Problem Solver
                </p>

                <a href="#portfolio" class="cta-btn">
                    View My Work
                </a>

            </section>
            <section id="about">
                <div class="container about-grid">

                    <div class="about-image">
                        <img src="images/avatar.jpg" alt="">
                    </div>

                    <div class="about-content">
                        <h2>About Me</h2>

                        <p class="lead">
                            I'm a passionate developer...
                        </p>

                        <p>
                            Specialized in Frontend...
                        </p>
                    </div>
                </div>
            </section>
            <section id="skill">
                <div class="container">

                    <h2>My Skills</h2>

                    <div class="skills-grid">

                        <div class="skill-item">
                            <span>HTML5</span>

                            <div class="skill-bar">
                                <div class="skill-progress html"></div>
                            </div>
                        </div>

                    </div>

                </div>

            </section>
            <section id="portfolio"></section>
            <section id="contact"></section>
            <footer></footer>
        </main>
    </body>
</html>
