<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Công Việc</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="container">
        <header>
            <h1>Quản Lý Công Việc Cá Nhân</h1>

            <button id="openModalBtn" class="add-btn">
                + Thêm công việc
            </button>
        </header>

        <!-- Thống kê -->
        <section class="summary">
            <div class="summary-card">
                <h3>Tổng</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="summary-card completed">
                <h3>Hoàn thành</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="summary-card pending">
                <h3>Chưa hoàn thành</h3>
                <p id="pendingTasks">0</p>
            </div>
        </section>

        <!-- Danh sách -->
        <section id="taskList" class="task-list">
            <!-- Render JS -->
        </section>
    </div>

    <!-- Popup -->
    <div id="taskModal" class="modal">
        <div class="modal-content">

            <div class="modal-header">
                <h2 id="modalTitle">Thêm công việc</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>

            <form id="taskForm">

                <input type="hidden" id="taskId" />

                <div class="form-group">
                    <label>Tiêu đề</label>
                    <input type="text" id="title" required />
                </div>

                <div class="form-group">
                    <label>Mô tả</label>
                    <textarea id="description"></textarea>
                </div>

                <div class="form-group">
                    <label>Hạn hoàn thành</label>
                    <input type="date" id="deadline" required />
                </div>

                <div class="form-group">
                    <label>Mức ưu tiên</label>

                    <select id="priority">
                        <option value="Thấp">Thấp</option>
                        <option value="Trung bình">Trung bình</option>
                        <option value="Cao">Cao</option>
                    </select>
                </div>

                <button type="submit" class="save-btn">
                    Lưu công việc
                </button>

            </form>
        </div>
    </div>

    <!-- Thông báo -->
    <div id="messageBox" class="message-box">
        Thành công
    </div>

    <script src="script.js"></script>
</body>
</html>
