<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <header>
        <div class="logo">Shop</div>

        <div class="hamburger">☰</div>

        <nav>
            <ul>
                <li>Home</li>
                <li>Products</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>

    <div class="container">

        <aside class="sidebar">
            <h3>Filters</h3>
            <select>
                <option>All</option>
                <option>Phone</option>
                <option>Laptop</option>
            </select>
        </aside>

        <main class="products">

            <div class="card">
                <img src="https://picsum.photos/300/200?1">
                <h3>Product 1</h3>
                <p>$100</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?2">
                <h3>Product 2</h3>
                <p>$120</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?3">
                <h3>Product 3</h3>
                <p>$150</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?4">
                <h3>Product 4</h3>
                <p>$180</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?5">
                <h3>Product 5</h3>
                <p>$200</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?6">
                <h3>Product 6</h3>
                <p>$220</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?7">
                <h3>Product 7</h3>
                <p>$250</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?8">
                <h3>Product 8</h3>
                <p>$300</p>
            </div>

        </main>

        <aside class="ads">
            <h3>Ads</h3>
        </aside>

    </div>

    <footer>
        Responsive Footer
    </footer>

</body>
</html>
