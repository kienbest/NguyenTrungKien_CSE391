<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Page</title>
    <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <!-- HEADER -->
    <header class="header">

        <div class="logo">
            ShopX
        </div>

        <div class="hamburger">
            ☰
        </div>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>

    </header>

    <!-- MAIN -->
    <main class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <h3>Filters</h3>

            <select>
                <option>Category</option>
                <option>Shoes</option>
                <option>Phones</option>
                <option>Fashion</option>
            </select>

            <select>
                <option>Price</option>
                <option>Low → High</option>
                <option>High → Low</option>
            </select>

        </aside>

        <!-- PRODUCTS -->
        <section class="products">

            <!-- CARD 1 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?1">
                <h3>Product 1</h3>
                <p>$99</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 2 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?2">
                <h3>Product 2</h3>
                <p>$120</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 3 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?3">
                <h3>Product 3</h3>
                <p>$150</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 4 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?4">
                <h3>Product 4</h3>
                <p>$80</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 5 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?5">
                <h3>Product 5</h3>
                <p>$110</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 6 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?6">
                <h3>Product 6</h3>
                <p>$130</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 7 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?7">
                <h3>Product 7</h3>
                <p>$95</p>
                <button>Buy Now</button>
            </div>

            <!-- CARD 8 -->
            <div class="card">
                <img src="https://picsum.photos/300/200?8">
                <h3>Product 8</h3>
                <p>$140</p>
                <button>Buy Now</button>
            </div>

        </section>

        <!-- ADS -->
        <aside class="ads">
            <h3>Advertisement</h3>
            <p>Special Sale 50%</p>
        </aside>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        © 2025 ShopX Responsive Page
    </footer>

</body>
</html>
