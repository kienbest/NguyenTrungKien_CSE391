<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>
<body>

    <div class="layout">

        <!-- Header -->
        <header class="header">
            HEADER
        </header>

        <!-- Hero -->
        <section class="hero">
            HERO BANNER
        </section>

        <!-- Sidebar -->
        <aside class="sidebar">

            <h3>Filters</h3>

            <label><input type="checkbox"> Laptop</label>
            <label><input type="checkbox"> Phone</label>
            <label><input type="checkbox"> Tablet</label>

        </aside>

        <!-- Main -->
        <main class="main-content">

            <div class="product-card featured">
                <img src="https://picsum.photos/300/200?1">
                <h3>Featured Product</h3>
                <p>$200</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?2">
                <h3>Product 2</h3>
                <p>$120</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?3">
                <h3>Product 3</h3>
                <p>$140</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?4">
                <h3>Product 4</h3>
                <p>$160</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?5">
                <h3>Product 5</h3>
                <p>$180</p>
            </div>

            <div class="product-card">
                <img src="https://picsum.photos/300/200?6">
                <h3>Product 6</h3>
                <p>$210</p>
            </div>

        </main>

        <!-- Ads -->
        <aside class="ads">

            <img src="https://picsum.photos/200/500">

        </aside>

        <!-- Footer -->
        <footer class="footer">
            FOOTER
        </footer>

    </div>

</body>
</html>
